<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MascotasIADev - Panel de Leads</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans p-8">

    <div class="max-w-4xl mx-auto">
        <!-- Encabezado -->
        <div class="bg-blue-600 text-white p-6 rounded-t-lg shadow-md flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold">MascotasIADev 🐾</h1>
                <p class="text-sm opacity-90">Panel de Control para Veterinarias</p>
            </div>
        </div>

        <!-- Buscador de Negocio (Login simulado) -->
        <div class="bg-white p-6 rounded-b-lg shadow-md mb-6">
            <label class="block text-sm font-medium text-gray-700 mb-2">Ingresa el ID de tu Veterinaria (Teléfono WhatsApp):</label>
            <div class="flex gap-4">
                <input type="text" id="tenantInput" placeholder="Ej. 1433813413148961" 
                    class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 outline-none">
                <button onclick="buscarLeads()" 
                    class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-lg transition duration-200">
                    Ver mis Leads
                </button>
            </div>
        </div>

        <!-- Tabla de Resultados -->
        <div class="bg-white rounded-lg shadow-md overflow-hidden">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Fecha</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Cliente</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Teléfono</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Interés / Resumen</th>
                    </tr>
                </thead>
                <tbody id="tablaLeads" class="bg-white divide-y divide-gray-200">
                    <tr>
                        <td colspan="4" class="px-6 py-4 text-center text-sm text-gray-500">
                            Ingresa tu ID arriba para cargar tus prospectos.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Lógica de conexión con tu Backend en Render -->
    <script>
        async function buscarLeads() {
            const tenantId = document.getElementById('tenantInput').value.trim();
            const tabla = document.getElementById('tablaLeads');

            if (!tenantId) {
                alert('Por favor ingresa un ID válido.');
                return;
            }

            tabla.innerHTML = `<tr><td colspan="4" class="px-6 py-4 text-center text-sm text-blue-600 font-bold">⏳ Buscando en la base de datos...</td></tr>`;

            try {
                // Aquí llamamos a la ruta que creamos en el paso anterior
                const respuesta = await fetch(`https://mascotasiadev.onrender.com/api/dashboard/leads/${tenantId}`);
                const json = await respuesta.json();

                if (json.success && json.data.length > 0) {
                    tabla.innerHTML = ''; // Limpiamos la tabla
                    
                    json.data.forEach(lead => {
                        // Formateamos la fecha para que se vea legible
                        const fecha = new Date(lead.createdAt).toLocaleDateString('es-ES', { 
                            year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' 
                        });

                        const fila = `
                            <tr class="hover:bg-gray-50">
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${fecha}</td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${lead.name}</td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${lead.phoneNumber}</td>
                                <td class="px-6 py-4 text-sm text-gray-500">${lead.summary}</td>
                            </tr>
                        `;
                        tabla.innerHTML += fila;
                    });
                } else {
                    tabla.innerHTML = `<tr><td colspan="4" class="px-6 py-4 text-center text-sm text-gray-500">No se encontraron leads para este negocio aún.</td></tr>`;
                }
            } catch (error) {
                console.error("Error conectando con el backend:", error);
                tabla.innerHTML = `<tr><td colspan="4" class="px-6 py-4 text-center text-sm text-red-500">❌ Error de conexión con el servidor.</td></tr>`;
            }
        }
    </script>
</body>
</html>
